# This repo dogfoods its own reusable workflow via a local reference.
# Consumer repos get the equivalent stub from workflow-stubs/.
name: Commit type sync

on:
  pull_request:
    paths:
      - commit-types.mjs
      - git-conventional-commits.yaml
      - scripts/conventional-commit-config.sh
      - scripts/check-commit-types-sync.sh
      - .github/workflows/reusable-commit-types-sync.yml
  push:
    branches: [main]
    paths:
      - commit-types.mjs
      - git-conventional-commits.yaml
      - scripts/conventional-commit-config.sh
      - scripts/check-commit-types-sync.sh
      - .github/workflows/reusable-commit-types-sync.yml

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/reusable-commit-types-sync.yml
