# This repo dogfoods its own reusable workflow via a local reference
# (consumer repos get the equivalent stub from workflow-stubs/). The page map
# is .github/confluence-sync.yml; Confluence is a read-only mirror — the repo
# is the source of truth. Ops notes: MAINTENANCE.md.
name: Confluence docs sync

on:
  push:
    branches: [main]
    paths:
      - '**.md'
      - .github/confluence-sync.yml
      - scripts/confluence-sync.sh
      - .github/workflows/confluence-sync.yml
      - .github/workflows/reusable-confluence-sync.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    uses: ./.github/workflows/reusable-confluence-sync.yml
    secrets:
      CONFLUENCE_USER: ${{ secrets.CONFLUENCE_USER }}
      CONFLUENCE_TOKEN: ${{ secrets.CONFLUENCE_TOKEN }}
