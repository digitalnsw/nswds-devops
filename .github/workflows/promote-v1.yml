# Gated promotion of the mutable v1 tag — the ref every consumer stub
# executes reusable workflows from (with that repo's secrets in reach), so a
# tag move is a fleet-wide deploy and is treated like one:
#
#   - refs/tags/v* is ruleset-protected; nobody force-pushes it by hand.
#   - This workflow is the promotion path. It runs behind the v1-promotion
#     environment (required reviewer) and pushes over RELEASE_DEPLOY_KEY,
#     the ruleset's bypass actor — the same model release commits use on
#     the protected main branch.
#   - The previous target is recorded in the run summary; rollback is
#     re-running this workflow with that SHA.
#
# The preconditions that used to be convention in MAINTENANCE.md are
# machine-enforced here: the target must be on main and its checks green.
#
# Repo-local to nswds-devops — NOT synced to consumers.
name: Promote v1

on:
  workflow_dispatch:
    inputs:
      target:
        description: >-
          Commit SHA on main that v1 should point to. Leave empty to promote
          the newest promotable commit on main (chore(release) [skip ci]
          commits are skipped automatically).
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: promote-v1
  cancel-in-progress: false

jobs:
  promote:
    name: promote
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: v1-promotion
    steps:
      - name: Checkout (deploy key)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - name: Validate the target commit
        id: target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail

          if [ -z "${TARGET}" ]; then
            # No target given — walk back from the head of main to the newest
            # promotable commit. Release commits are [skip ci] (no check runs)
            # and can never pass the gate below, so skip them by subject; the
            # check-run count guards against any other runless commit. The
            # promote job's own check runs are excluded — a dispatch attaches
            # this run to the current main head, which may be a release commit.
            for candidate in $(git log --format='%H' -10 origin/main); do
              subject="$(git log -1 --format='%s' "$candidate")"
              case "$subject" in "chore(release):"*) continue ;; esac
              runs="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${candidate}/check-runs?per_page=100" \
                --jq '[.check_runs[] | select(.name != "promote")] | length')"
              if [ "$runs" -gt 0 ]; then
                TARGET="$candidate"
                echo "ℹ️ No target given — auto-selected the newest promotable commit on main:"
                echo "   ${candidate}  ${subject}"
                break
              fi
            done
            if [ -z "${TARGET}" ]; then
              echo "::error::no promotable commit found in the last 10 commits on main (release commits and commits without check runs are skipped) — pass a target SHA explicitly"
              exit 1
            fi
          fi

          sha="$(git rev-parse --verify "${TARGET}^{commit}")"
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::${sha} is not on main — v1 only ever points at main history"
            exit 1
          fi
          # Exclude this workflow's own check runs (jq: .name != "promote"):
          # when the target is the current main head, this very job attaches
          # to it as an in-progress check — counting itself as "pending" would
          # make promotion structurally impossible, and an earlier failed
          # attempt would poison the commit red forever. If the promote job
          # is ever renamed, update the filter to match.
          checks="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/check-runs?per_page=100" --jq '[.check_runs[] | select(.name != "promote")]')"
          bad="$(jq '[.[] | select(.conclusion as $c | ["failure", "cancelled", "timed_out", "action_required"] | index($c))] | length' <<<"$checks")"
          pending="$(jq '[.[] | select(.status != "completed")] | length' <<<"$checks")"
          ok="$(jq '[.[] | select(.conclusion == "success")] | length' <<<"$checks")"
          # Two distinct refusals: real failures need investigation; pending
          # checks just mean "too early" (the sync fan-out on a fresh merge
          # commit runs for ~10 minutes) — nothing is wrong, re-run later.
          if [ "$bad" -gt 0 ]; then
            echo "::error::check runs on ${sha}: ${bad} FAILED (${ok} success, ${pending} pending) — investigate the failures before promoting"
            exit 1
          fi
          if [ "$pending" -gt 0 ] || [ "$ok" -eq 0 ]; then
            echo "::error::nothing has failed on ${sha} — ${pending} check(s) still running (${ok} green so far). A fresh merge commit's sync fan-out takes ~10 minutes; re-run this workflow once the checks finish."
            exit 1
          fi
          echo "sha=${sha}" >>"$GITHUB_OUTPUT"

      - name: Record the previous target and move the tag
        env:
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          prev="$(git ls-remote origin refs/tags/v1 | cut -f1)"
          {
            echo '## v1 promotion'
            echo "- previous: \`${prev:-none}\`"
            echo "- new: \`${SHA}\`"
            echo "- rollback: re-run this workflow with target \`${prev:-none}\`"
          } >>"$GITHUB_STEP_SUMMARY"
          git tag -f v1 "$SHA"
          git push --force origin refs/tags/v1
