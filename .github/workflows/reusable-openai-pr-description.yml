# Reusable implementation — repos call this via the synced
# openai-pr-description.yml stub. Edit here; never in a consumer repo.
#
# Implemented in-house with gh + curl against the Vercel AI Gateway
# (Responses API). The previous platisd/openai-pr-description action only
# talks to api.openai.com and can't be pointed at the gateway; dropping it
# also means no third-party action holds the API key, and the diff is passed
# through the fleet's shared secret redaction before it leaves the runner.
name: Autofill PR description (reusable)

on:
  workflow_call:
    secrets:
      AI_GATEWAY_API_KEY:
        description: "Org-level Vercel AI Gateway key, mapped explicitly by the stubs (least privilege — not inherit)."
        required: false
      AZURE_OPENAI_API_KEY:
        description: "Optional org-level Azure OpenAI key. Used only as a fallback when the AI Gateway answers HTTP 402 (out of credits); endpoint/deployment come from the AZURE_OPENAI_ENDPOINT / AZURE_OPENAI_DEPLOYMENT org variables."
        required: false

permissions:
  contents: read
  pull-requests: write

jobs:
  openai-pr-description:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Skip for fork PRs — secrets are not available there
    if: github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name

    env:
      # provider/model slug, routed via the Vercel AI Gateway. Org variables
      # override without a code change (same mechanism as CI_SKIP_*).
      #
      # gpt-5.6-sol, not gpt-4o-mini: several openai/* models currently fail
      # through the gateway with an Azure "deployment does not exist" 404
      # (gpt-4o-mini and gpt-5.5 both reproduce it). Re-check before changing.
      AI_MODEL: ${{ vars.AI_MODEL || 'openai/gpt-5.6-sol' }}
      # Hard provider pin (providerOptions.gateway.only) — no failover to
      # another provider. Set the org variable to the literal "none" to restore
      # the gateway's own routing: Actions renders an unset and an empty org
      # variable identically as "", so an empty value cannot mean "no pin" here.
      # The sentinel is normalised to empty in the step below.
      AI_PROVIDER: ${{ vars.AI_PROVIDER || 'azure' }}
      # Caps on the diff sent to the model (lines first, then bytes).
      DIFF_MAX_LINES: '1500'
      DIFF_MAX_BYTES: '100000'

    steps:
      # Checkout gives us the caller repo's synced scripts/secret-redaction.sh
      # so the diff is redacted before it's sent to the gateway.
      # Check out the PR *base*, not the default merge ref: this job's env
      # holds AI_GATEWAY_API_KEY, and sourcing base-ref scripts means a PR
      # can't alter the code this secrets-bearing job executes.
      - name: Checkout code (PR base)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Ensure jq is available
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y jq
          fi

      - name: Autofill PR description (AI Gateway, Responses API)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          # Azure OpenAI fallback (dormant unless the org configures both the
          # secret and the endpoint variable). vars resolve from the caller
          # repo/org, same mechanism as CI_SKIP_* in reusable-ci.
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_DEPLOYMENT: ${{ vars.AZURE_OPENAI_DEPLOYMENT || 'gpt-5.6-sol' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [[ -z "${AI_GATEWAY_API_KEY:-}" ]]; then
            # Soft skip (not a failure): during the AI Gateway rollout, repos whose
            # stubs haven't synced yet don't pass this secret.
            echo "⚠️ Missing secrets.AI_GATEWAY_API_KEY (org-level secret). Skipping description autofill."
            exit 0
          fi

          BODY="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq '.body // ""')"

          # Only fill an empty description — never overwrite what a human wrote.
          # The ai-pr-title marker comment doesn't count as content.
          BODY_SANS_MARKER="$(printf '%s' "$BODY" \
            | sed -E 's/<!--[[:space:]]*ai-pr-title-marker:[^>]*-->//g' \
            | tr -d '[:space:]')"
          if [[ -n "$BODY_SANS_MARKER" ]]; then
            echo "ℹ️ PR already has a description; leaving it untouched."
            exit 0
          fi

          # Same truncation idiom as git-commit.sh: `|| true` absorbs the SIGPIPE
          # that head's byte cap can send up the pipeline under pipefail.
          DIFF="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" \
            -H "Accept: application/vnd.github.diff" \
            | sed -n "1,${DIFF_MAX_LINES}p" | head -c "$DIFF_MAX_BYTES" || true)"

          if [[ -z "${DIFF//[[:space:]]/}" ]]; then
            echo "ℹ️ Empty diff; nothing to describe."
            exit 0
          fi

          # Redact common secret patterns before the diff leaves the runner.
          # (Same helper the local git-commit / branch-name scripts use.)
          if [[ -f scripts/secret-redaction.sh ]]; then
            # shellcheck source=/dev/null
            source scripts/secret-redaction.sh
            DIFF="$(redact_sensitive_diff "$DIFF")"
          else
            echo "ℹ️ scripts/secret-redaction.sh not present in this repo; sending diff unredacted."
          fi

          SYSTEM_PROMPT="You write pull request descriptions. Given a unified diff, produce a concise Markdown description: a one-paragraph summary of the change, then a '## Changes' section with a short bullet list grouping related changes. Describe only what is in the diff — never invent changes. Output only the description (no code fence around the whole output, no preamble)."

          # "none" is the disable sentinel — an empty org variable is
          # indistinguishable from an unset one in Actions, so it can't be used
          # to mean "no provider pin". Normalise it to empty here.
          if [[ "${AI_PROVIDER:-}" == "none" ]]; then
            AI_PROVIDER=""
          fi

          # No temperature: reasoning-family models reject the field, so omitting
          # it keeps AI_MODEL swappable without further edits.
          JSON_PAYLOAD="$(jq -n \
            --arg model "$AI_MODEL" \
            --arg provider "${AI_PROVIDER:-}" \
            --arg system "$SYSTEM_PROMPT" \
            --arg diff "$DIFF" \
            '{
              model: $model,
              input: [
                { role: "system", content: [ { type: "input_text", text: $system } ] },
                { role: "user",   content: [ { type: "input_text", text: ("Unified diff (may be truncated):\n\n" + $diff) } ] }
              ],
              max_output_tokens: 800
            }
            + (if $provider != "" then { providerOptions: { gateway: { only: [$provider] } } } else {} end)')"

          # POSTs a Responses API payload; body on stdout. Returns 42 on
          # HTTP 402 (out of credits — caller may fail over), 1 otherwise.
          call_responses_api() {
            local url="$1" auth_header="$2" req_payload="$3" label="$4"
            local raw
            if ! raw="$(curl -sS "$url" \
              -H "$auth_header" \
              -H "Content-Type: application/json" \
              -w $'\n__HTTP_STATUS__:%{http_code}' \
              -d "$req_payload" 2>&1)"; then
              echo "❌ $label request failed (curl transport error)." >&2
              printf '%s' "$raw" | head -c 400 >&2; echo >&2
              return 1
            fi
            local status="${raw##*__HTTP_STATUS__:}"
            local body="${raw%$'\n'__HTTP_STATUS__:*}"
            if [[ "$status" == "402" ]]; then
              echo "⚠️ $label returned HTTP 402 — account is out of credits." >&2
              return 42
            fi
            if ! printf '%s' "$body" | jq -e . >/dev/null 2>&1; then
              echo "❌ $label returned a non-JSON response (HTTP $status)." >&2
              printf '%s' "$body" | head -c 400 >&2; echo >&2
              return 1
            fi
            if printf '%s' "$body" | jq -e '.error' >/dev/null; then
              echo "❌ $label API error: $(printf '%s' "$body" | jq -r '.error.message // .error.type // "unknown"' | head -c 200)" >&2
              return 1
            fi
            printf '%s' "$body"
          }

          rc=0
          RESPONSE="$(call_responses_api "https://ai-gateway.vercel.sh/v1/responses" \
            "Authorization: Bearer ${AI_GATEWAY_API_KEY}" "$JSON_PAYLOAD" "AI Gateway")" || rc=$?

          # Out of gateway credits → retry on Azure OpenAI when configured.
          # Azure's v1 surface takes the deployment name as the model.
          if [[ $rc -eq 42 && -n "${AZURE_OPENAI_API_KEY:-}" && -n "${AZURE_OPENAI_ENDPOINT:-}" ]]; then
            echo "↪️ Falling back to Azure OpenAI (deployment: ${AZURE_OPENAI_DEPLOYMENT})."
            AZURE_PAYLOAD="$(printf '%s' "$JSON_PAYLOAD" \
              | jq --arg m "$AZURE_OPENAI_DEPLOYMENT" '.model = $m | del(.temperature) | del(.providerOptions)')"
            rc=0
            RESPONSE="$(call_responses_api "${AZURE_OPENAI_ENDPOINT%/}/openai/v1/responses" \
              "api-key: ${AZURE_OPENAI_API_KEY}" "$AZURE_PAYLOAD" "Azure OpenAI")" || rc=$?
          fi

          if [[ $rc -ne 0 ]]; then
            echo "❌ AI request failed on all configured providers."
            exit 1
          fi

          DESCRIPTION="$(echo "$RESPONSE" | jq -r '
            [(.output[]? | select(.type=="message") | .content[]? | select(.type=="output_text") | .text)] | join("")
          ')"

          if [[ -z "${DESCRIPTION//[[:space:]]/}" ]]; then
            echo "❌ Could not extract a description from the response (no output_text)."
            exit 1
          fi

          # Preserve the ai-pr-title marker (if present) so title refreshes keep working.
          MARKER="$(printf '%s' "$BODY" \
            | grep -oE '<!--[[:space:]]*ai-pr-title-marker:[[:space:]]*[A-Za-z0-9+/=]+[[:space:]]*-->' \
            | head -n 1 || true)"
          NEW_BODY="$DESCRIPTION"
          if [[ -n "$MARKER" ]]; then
            NEW_BODY="${DESCRIPTION}"$'\n\n'"${MARKER}"
          fi

          gh api -X PATCH "repos/${REPO}/pulls/${PR_NUMBER}" -f body="$NEW_BODY" >/dev/null
          echo "✅ PR description autofilled."
