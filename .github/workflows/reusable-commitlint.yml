# Reusable implementation — repos call this via the synced commitlint.yml stub.
# Edit here; never in a consumer repo.
name: Commitlint (reusable)

on:
  workflow_call:
    inputs:
      node-version:
        description: Node version used when the caller repo has no .nvmrc
        type: string
        default: '24'

permissions:
  contents: read

jobs:
  commitlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Reusable workflows run in the caller's context: this checks out the
      # consumer repo, and its own devDependencies provide commitlint.
      #
      # fetch-depth: 0 is required — the base..head range linted below can
      # reach arbitrarily far back, and a shallow clone makes the range
      # unresolvable. But an unfiltered full fetch also drags down every
      # historical revision of every file, which this job never reads: linting
      # touches commit messages only. filter: blob:none makes it a blobless
      # partial clone — the commit graph arrives complete, and file content is
      # fetched lazily, in one batch, for the single tree that gets checked out
      # (npm clean-install still finds its package-lock.json).
      #
      # The cost that removes is proportional to repo content, not commit
      # count, so it lands hardest on the fleet's heaviest repos:
      # nswds-email-framework tracks ~3.5k generated HTML files, and on
      # 2026-08-03 its fetch stalled long enough to burn the whole
      # timeout-minutes below and cancel the job mid-checkout, blocking a PR
      # on a check that never ran. Blobless doesn't make a stalled network
      # impossible, but it cuts the transfer this job is exposed to by orders
      # of magnitude on exactly the repos that were closest to the limit.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Setup Node.js (.nvmrc)
        if: ${{ hashFiles('.nvmrc') != '' }}
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - name: Setup Node.js (fallback)
        if: ${{ hashFiles('.nvmrc') == '' }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
      - run: npm clean-install
      - name: Validate PR commit messages
        run: >-
          npx commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose

      # On a squash-merged repo the commits linted above are all discarded, and
      # the squash subject comes from the PR title. That title is then the only
      # string semantic-release ever analyses, so an unconventional or
      # wrongly-typed one is a silently missed release rather than a cosmetic
      # problem — a `chore:` title on a PR full of `fix:` commits ships nothing
      # and nothing goes red. This is a step in the existing job on purpose: it
      # inherits the `commitlint / commitlint` status context, so every repo
      # already requiring that check gains title enforcement without touching a
      # single ruleset.
      #
      # The title is untrusted — anyone can open a PR — so it is passed through
      # the environment and quoted. Do not interpolate `${{ }}` into this run
      # block: a crafted title would execute as shell.
      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | npx commitlint --verbose
