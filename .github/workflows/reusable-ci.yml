# Reusable implementation — repos call this via the synced ci.yml stub.
# Edit here; never in a consumer repo.
#
# Caching policy: every setup-node step caches ~/.npm keyed on the lockfile
# hash. This only changes where npm ci fetches tarballs from — node_modules
# is still wiped and rebuilt, and npm ci still verifies every package
# against the lockfile's integrity hashes, so the lockfile-integrity
# guarantee this workflow exists for is untouched. Lockfile-bump PRs are
# cold by definition. reusable-release deliberately stays UNCACHED
# (package-manager-cache: false) — keep the publish path pristine.
#
# This is the merge gate rulesets require (context: "install / install").
# It ports nswds-design's local CI workflow: the pull_request event checks
# out the test merge of PR + base, so a bad conflict resolution or a
# corrupted lockfile fails here before it can land on main.
name: CI (reusable)

on:
  workflow_call:
    inputs:
      node-version:
        description: Node version used when the caller repo has no .nvmrc
        type: string
        default: '24'

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # npm ci reports a lockfile with conflict markers as "no package-lock.json",
      # which is misleading — catch markers in any tracked file with a clear error.
      #
      # All four marker types: `=======` closes every conflict block, and
      # `|||||||` appears for anyone running merge.conflictStyle=diff3/zdiff3.
      # The `( .*)?$` tail is load-bearing, not tidiness — `=======` ends the
      # line with no label, so the pattern has to accept end-of-line, and
      # anchoring it is what stops a bare `^={7}` prefix from matching a
      # Markdown setext underline or the `=` rule under a LICENSE title
      # (nswds-eslint-config's LICENSE line 2 is 34 `=` characters) and
      # failing this job on every run, forever. Do not relax it to a prefix
      # match.
      #
      # The exit status is captured rather than tested with `if git grep`,
      # because git grep has three outcomes, not two: 0 found, 1 none, >1 the
      # scan itself failed (128 for a bad pattern or a broken repo). Under a
      # plain `if`, that third case is indistinguishable from "clean" and the
      # gate would pass without having looked at anything. `|| status=$?` also
      # keeps the expected exit 1 from tripping the shell's `-e`.
      - name: Check for unresolved merge conflict markers
        run: |
          status=0
          git grep -InE '^(<{7}|={7}|>{7}|\|{7})( .*)?$' || status=$?
          if [ "$status" -eq 0 ]; then
            echo "::error::Unresolved merge conflict markers found in the files above."
            exit 1
          elif [ "$status" -ne 1 ]; then
            echo "::error::git grep exited $status, so the scan never ran. Failing instead of reporting a clean tree."
            exit 1
          fi

      # A package declared BOTH as a direct dependency and as a literal-pinned
      # `overrides` entry is one upstream release away from silently losing
      # Renovate for this entire repo. The shared preset disables updates to
      # depType `overrides` (see default.json), so that half stays pinned on the
      # outgoing spec while the direct dependency keeps moving; the next bump
      # runs `npm install <pkg>@<new>`, npm refuses with EOVERRIDE, and Renovate
      # throws lockfile-error — which aborts the whole repository run before it
      # reaches ensureDependencyDashboard(). Nothing goes red anywhere: no
      # branch, no PR, no error comment, and a Dependency Dashboard that stops
      # being rewritten, so a ticked checkbox stays ticked and reads as ignored.
      # reviewers, engagement and awards sat like that for a week from
      # 2026-08-06 (postcss 8.5.26) before anyone diagnosed it. The npm
      # self-override canary in nswds-devops catches this weekly; this gate
      # stops the shape reaching main in the first place.
      #
      # The fix is always npm's $-reference form (`"postcss": "$postcss"`),
      # which resolves to the direct dependency's own spec, so the two cannot
      # diverge — hence the startswith("$") exemption rather than a package
      # allowlist. There is no legitimate literal form, so this is a hard fail.
      #
      # Only top-level string values are checked. A nested override
      # (`{"@tailwindcss/typography": {"postcss-selector-parser": "^6.1.3"}}`)
      # gives the PARENT key no version spec and applies only inside that
      # subtree, so it cannot collide with a root direct dependency — flagging
      # one would be a false positive. All four dependency blocks are folded in
      # because npm's EOVERRIDE check does not care which one the direct
      # dependency came from.
      #
      # jq's exit status is captured for the same reason git grep's is above: an
      # unparseable manifest would otherwise produce empty output and sail
      # through as clean without having scanned anything.
      - name: Check for literal npm self-overrides
        if: ${{ hashFiles('package.json') != '' }}
        run: |
          status=0
          offenders=$(jq -r '
            ((.dependencies // {}) + (.devDependencies // {})
              + (.optionalDependencies // {}) + (.peerDependencies // {})) as $deps
            | (.overrides // {})
            | to_entries[]
            | select((.value | type) == "string")
            | select((.value | startswith("$")) | not)
            | select(.key | in($deps))
            | "  \(.key) — override \(.value), direct dependency \($deps[.key])"
          ' package.json) || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::jq exited $status, so package.json was never scanned. Failing instead of reporting a clean manifest."
            exit 1
          fi
          if [ -n "$offenders" ]; then
            echo "$offenders"
            echo "::error::Literal npm self-override(s) above. Each is also a direct dependency, so the next release of that package will abort Renovate for this repo with no visible error. Use npm's reference form instead, e.g. \"postcss\": \"\$postcss\"."
            exit 1
          fi

      - name: Setup Node.js (.nvmrc)
        if: ${{ hashFiles('.nvmrc') != '' }}
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Setup Node.js (fallback)
        if: ${{ hashFiles('.nvmrc') == '' }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # Fails on any manifest/lockfile mismatch — the check Snyk-corrupted
      # lockfiles used to sail past when nothing enforced it.
      - name: Install dependencies
        run: npm clean-install

      # App repos whose builds need deploy-time env (Next.js page-data
      # collection hits auth/DB) opt out with a repo Actions variable:
      # Settings → Secrets and variables → Actions → Variables →
      # CI_SKIP_BUILD=true. The conflict-marker and lockfile gates above
      # still run everywhere — only the build is skipped.
      - name: Build
        if: ${{ vars.CI_SKIP_BUILD != 'true' }}
        run: npm run build --if-present

  # Lint gate. Added after nswds-app#418 showed a fatally broken `eslint .`
  # (ESLint 10 plugin crash) merging with all checks green — nothing here ran
  # lint. `--if-present` no-ops in repos without a lint script; repos whose
  # lint is temporarily red can opt out with a repo Actions variable
  # (Settings → Secrets and variables → Actions → Variables → CI_SKIP_LINT=true).
  # Not required by rulesets unless a repo adds the "install / lint" context.
  lint:
    if: ${{ vars.CI_SKIP_LINT != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js (.nvmrc)
        if: ${{ hashFiles('.nvmrc') != '' }}
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Setup Node.js (fallback)
        if: ${{ hashFiles('.nvmrc') == '' }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm clean-install

      - name: Lint
        run: npm run lint --if-present

  # Type-check gate. Added after attestation#219 (zod 3 -> 4) merged green and
  # broke the production build: zod 4 removed the `required_error` parameter, so
  # `tsc` and `next build` both failed, but nothing in CI compiles TypeScript.
  # Repos that skip the build (CI_SKIP_BUILD, set wherever the build needs
  # deploy-time env) have no type coverage at all without this, and a type error
  # then surfaces on the deploy platform instead of the PR.
  #
  # Runs the repo's own script rather than a bare `tsc --noEmit`: `--noEmit` is
  # rejected outright on composite/project-reference setups, where `tsc -b` is
  # the correct invocation, and only the repo knows which it is. Both spellings
  # are accepted because the fleet uses both. Detected in a step rather than an
  # `if:` expression because workflow expressions can't read package.json
  # (same pattern as the npm-test probe below). Opt out with
  # CI_SKIP_TYPECHECK=true.
  # Not required by rulesets unless a repo adds the "install / typecheck" context.
  typecheck:
    if: ${{ vars.CI_SKIP_TYPECHECK != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Detect type-check script
        id: tsc
        run: |
          script=''
          if [ -f package.json ]; then
            script=$(node -e "
              const s = require('./package.json').scripts || {};
              process.stdout.write(s['type-check'] ? 'type-check' : (s.typecheck ? 'typecheck' : ''));
            ")
          fi
          if [ -n "$script" ]; then
            echo "script=$script" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js (.nvmrc)
        if: ${{ steps.tsc.outputs.script != '' && hashFiles('.nvmrc') != '' }}
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Setup Node.js (fallback)
        if: ${{ steps.tsc.outputs.script != '' && hashFiles('.nvmrc') == '' }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        if: ${{ steps.tsc.outputs.script != '' }}
        run: npm clean-install

      - name: Type-check
        if: ${{ steps.tsc.outputs.script != '' }}
        run: npm run ${{ steps.tsc.outputs.script }}

      - name: Nothing to run
        if: ${{ steps.tsc.outputs.script == '' }}
        run: echo "No type-check or typecheck script — nothing to check."

  # Format gate. The fleet's Prettier options are centralised in
  # @nswds/prettier-config, but every repo's `format` script is write-mode —
  # without a CI check the standard is convention, and drift only surfaces as
  # noisy style diffs in later PRs (awards#74 needed a follow-up style commit
  # for exactly this). Runs only when the repo has a Prettier config: a
  # config file, or the package.json "prettier" key — the latter is how
  # nswds-tokens and the config packages consume it, and workflow expressions
  # can't read package.json, hence the probe step (same pattern as the
  # npm-test probe below). Repos with latent unformatted files opt out with
  # CI_SKIP_FORMAT=true while they sweep.
  # Not required by rulesets unless a repo adds the "install / format" context.
  format:
    if: ${{ vars.CI_SKIP_FORMAT != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Detect Prettier config
        id: prettier
        run: |
          # Test each candidate independently. `ls a b c` exits non-zero if ANY
          # argument is missing, so the old single-ls probe reported "absent"
          # unless all three patterns matched at once — i.e. always. An unmatched
          # glob stays literal here, and `[ -e ]` on the literal is false.
          present=false
          for f in .prettierrc .prettierrc.* prettier.config.*; do
            if [ -e "$f" ]; then
              present=true
              break
            fi
          done
          if [ "$present" = false ] && [ -f package.json ] &&
            node -e "process.exit(require('./package.json').prettier ? 0 : 1)"; then
            present=true
          fi
          echo "present=$present" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js (.nvmrc)
        if: ${{ steps.prettier.outputs.present == 'true' && hashFiles('.nvmrc') != '' }}
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Setup Node.js (fallback)
        if: ${{ steps.prettier.outputs.present == 'true' && hashFiles('.nvmrc') == '' }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        if: ${{ steps.prettier.outputs.present == 'true' }}
        run: npm clean-install

      - name: Check formatting
        if: ${{ steps.prettier.outputs.present == 'true' }}
        run: npx --no-install prettier --check .

      - name: Nothing to run
        if: ${{ steps.prettier.outputs.present != 'true' }}
        run: echo "No Prettier config file or package.json prettier key — nothing to check."

  # Test gate: runs the repo's vitest suite when a vitest config exists,
  # otherwise its `npm test` script. Same silent-gap rationale as lint —
  # nswds-app's storybook browser suite never ran on PRs. Browser-mode suites
  # need a Playwright browser, installed only when the repo depends on
  # playwright. Opt out with CI_SKIP_TESTS=true.
  #
  # The npm-test path was added after nswds-email#485: gating the whole job on
  # a vitest config meant repos testing with `node --test` reported a green
  # "install / test" having installed nothing and run nothing — on that PR it
  # passed against a lockfile that could not install at all. Four repos were
  # affected (awards, nswds-email, nswds-eslint-config, nswds-prettier-config);
  # their suites were confirmed green from a clean checkout before this landed.
  # The npm-init default stub ("Error: no test specified") is treated as absent
  # so onboarding a repo that never wrote tests doesn't fail CI.
  #
  # Both probes look at the whole tree now, not just the root — see "Decide
  # what to run" below. Root-only vitest detection reopened the same silent
  # gap for monorepos (nswds-ui#171) that nswds-email#485 closed for node:test
  # repos.
  # Not required by rulesets unless a repo adds the "install / test" context.
  test:
    if: ${{ vars.CI_SKIP_TESTS != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js (.nvmrc)
        if: ${{ hashFiles('.nvmrc') != '' }}
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Setup Node.js (fallback)
        if: ${{ hashFiles('.nvmrc') == '' }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # Pick the entry point ONCE, in precedence order, so every later step
      # keys off a single decision instead of re-deriving it from hashFiles().
      #
      #   root-vitest  — a vitest config at the repo root. Unchanged behaviour.
      #   npm-test     — no root config, but the root has a real `test` script.
      #                  Unchanged behaviour, and it stays AHEAD of nested
      #                  configs on purpose: an aggregate script is the repo's
      #                  own entry point and may cover more than the suites a
      #                  config scan can see (nswds-email-design's root script
      #                  is `turbo test`; running only packages/email would
      #                  quietly narrow it).
      #   nested-vitest— no root config and no root script, but a workspace has
      #                  a config. This is the case that was broken: hashFiles()
      #                  only ever looked at the root, so nswds-ui (config at
      #                  apps/storybook/vitest.config.ts, no root test script)
      #                  fell through to "Nothing to run" and reported a GREEN
      #                  "install / test" having installed nothing and run
      #                  nothing — the exact silent gap this job exists to
      #                  close, one directory down. Caught on nswds-ui#171,
      #                  where it passed against a manifest that could not
      #                  install at all.
      #   none         — nothing to run.
      #
      # git ls-files rather than hashFiles('**/vitest.config.*'): the later
      # steps evaluate after npm clean-install, when a `**` glob would walk
      # every node_modules copy of vitest's own fixtures. Tracked files cannot
      # include node_modules, so the probe stays honest and cheap. Done in a
      # step rather than an `if:` expression for the same reason as the
      # typecheck and prettier probes above — workflow expressions cannot read
      # the filesystem or package.json.
      #
      # The directory list goes to a FILE, and only `mode` — a fixed enum from
      # the case below — becomes a step output. That split is a security
      # boundary, not a style choice. Directory names come from the PR's own
      # tree, and `${{ }}` is substituted into a run block as TEXT before bash
      # parses it, so a tracked `x$(id)y/vitest.config.ts` in an earlier draft
      # of this step executed `id` on the runner. A file read with `read -r`
      # is data at every stage; an interpolated output is code.
      #
      # dirname is done in-shell rather than with `xargs -n1 dirname` for the
      # same family of reasons: xargs word-splits on spaces, so a legitimate
      # `apps/my app/vitest.config.ts` yielded two bogus entries — one of them
      # `.`, which flipped the mode to root-vitest and ran vitest at a root
      # with no config at all.
      #
      # Paths containing a literal newline are out of scope: git quotes those
      # (core.quotePath), so the quoted form never matches the regex and the
      # config is skipped rather than mis-parsed.
      - name: Decide what to run
        id: probe
        run: |
          # Capture the listing's exit status explicitly — a `git ls-files`
          # that fails inside a pipeline leaves the pipeline reporting sort's
          # 0, i.e. "no configs", which is indistinguishable from a clean
          # repo. Same reasoning as the conflict-marker and jq gates above:
          # fail loudly rather than report a clean tree you never scanned.
          if ! tracked="$(git ls-files)"; then
            echo "::error::git ls-files failed, so the vitest config scan never ran. Failing instead of reporting no tests."
            exit 1
          fi

          printf '%s\n' "$tracked" \
            | grep -E '(^|/)vitest\.config\.[A-Za-z]+$' \
            | while IFS= read -r f; do
                case "$f" in
                  */*) printf '%s\n' "${f%/*}" ;;
                  *)   printf '.\n' ;;
                esac
              done \
            | sort -u > "$RUNNER_TEMP/vitest-config-dirs"

          if grep -qxF '.' "$RUNNER_TEMP/vitest-config-dirs"; then
            mode=root-vitest
          elif [ -f package.json ] && node -e "
            const t = (require('./package.json').scripts || {}).test || '';
            process.exit(t && !/no test specified/.test(t) ? 0 : 1);
          "; then
            mode=npm-test
          elif [ -s "$RUNNER_TEMP/vitest-config-dirs" ]; then
            mode=nested-vitest
          else
            mode=none
          fi

          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Mode: $mode"
          [ -s "$RUNNER_TEMP/vitest-config-dirs" ] && sed 's/^/  vitest config in: /' "$RUNNER_TEMP/vitest-config-dirs"
          exit 0

      - name: Install dependencies
        if: ${{ steps.probe.outputs.mode != 'none' }}
        run: npm clean-install

      # Browser-mode suites need a real browser. The playwright dependency can
      # sit in the root manifest OR in the workspace that owns a config
      # (nswds-ui declares it in apps/storybook, not at the root), so check
      # both before concluding there is nothing to install.
      #
      # Deliberately NOT run on the npm-test path, which is how it has always
      # been. Widening it there is tempting — an aggregate script COULD reach a
      # browser-mode suite — but no repo in the fleet is in that state, while
      # one concretely pays for it: nswds-email-framework declares playwright
      # at the root for its own visual/a11y suites, which have their own
      # configs and their own scripts, and its `npm test` is `test:scripts`, a
      # node:test run that needs no browser. Widening would add a Chromium and
      # apt-deps install to every one of its CI runs to guard a case that does
      # not exist.
      #
      # The manifest path reaches node through argv, never through the script
      # text: `require('./$dir/package.json')` inside a double-quoted shell
      # string lets a directory name containing a quote close the JS string
      # literal and run arbitrary JS.
      - name: Install Playwright browser (browser-mode vitest)
        if: ${{ steps.probe.outputs.mode == 'root-vitest' || steps.probe.outputs.mode == 'nested-vitest' }}
        run: |
          needs=false
          while IFS= read -r dir; do
            [ -f "$dir/package.json" ] || continue
            if node -e 'const path = require("node:path");
              const p = require(path.resolve(process.argv[1], "package.json"));
              process.exit((p.devDependencies?.playwright || p.dependencies?.playwright) ? 0 : 1);
            ' "$dir"; then
              needs=true
              break
            fi
          done < <(printf '.\n'; cat "$RUNNER_TEMP/vitest-config-dirs")
          if [ "$needs" = true ]; then
            npx playwright install chromium --with-deps
          else
            echo "No playwright dependency — skipping browser install."
          fi

      - name: Run vitest (root config)
        if: ${{ steps.probe.outputs.mode == 'root-vitest' }}
        # --no-install: a repo with a vitest config but no vitest dependency
        # should fail loudly, not have npx fetch and run latest from the registry.
        run: npx --no-install vitest run

      - name: Run npm test
        if: ${{ steps.probe.outputs.mode == 'npm-test' }}
        run: npm test

      # One invocation per config, so a second workspace suite cannot be
      # silently skipped the way the first one used to be. Prefers the owning
      # workspace's own `test` script, because only the repo knows how its
      # suite is meant to be invoked (nswds-ui's is `vitest --project storybook
      # run`) — the same reasoning the typecheck job gives for running the
      # repo's script instead of a bare `tsc --noEmit`. Bare vitest with --root
      # is the fallback for a workspace with no script of its own.
      - name: Run vitest (workspace configs)
        if: ${{ steps.probe.outputs.mode == 'nested-vitest' }}
        run: |
          while IFS= read -r dir; do
            # Three outcomes, not two: 0 the workspace has a real test script,
            # 1 it has none, 2 its package.json is missing or unparseable. The
            # earlier `2>/dev/null` collapsed 2 into 1 and quietly fell back to
            # bare vitest, which is the same "sail through as clean" failure
            # the jq gate above exists to prevent.
            rc=0
            node -e 'const path = require("node:path");
              let pkg;
              try { pkg = require(path.resolve(process.argv[1], "package.json")); }
              catch (err) { console.error(err.message); process.exit(2); }
              const t = (pkg.scripts || {}).test || "";
              process.exit(t && !/no test specified/.test(t) ? 0 : 1);
            ' "$dir" || rc=$?
            case "$rc" in
              0)
                echo "::group::npm test -w $dir"
                npm test -w "$dir"
                ;;
              1)
                echo "::group::vitest run --root $dir"
                npx --no-install vitest run --root "$dir"
                ;;
              *)
                echo "::error::$dir has a vitest config but its package.json could not be read. Failing instead of guessing how to run its suite."
                exit 1
                ;;
            esac
            echo '::endgroup::'
          done < "$RUNNER_TEMP/vitest-config-dirs"

      - name: Nothing to run
        if: ${{ steps.probe.outputs.mode == 'none' }}
        run: echo "No vitest config and no npm test script — nothing to run."
